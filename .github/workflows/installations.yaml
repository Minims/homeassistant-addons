---
name: Update installation counts

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installation-counts

jobs:
  update:
    if: github.repository == 'Minims/homeassistant-addons'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check installation updater
        run: python3 .github/scripts/test_update_installations.py
      - name: Refresh installation counts
        run: |
          curl -fsSL --retry 3 --max-time 30 https://analytics.home-assistant.io/addons.json |
            python3 .github/scripts/update_installations.py
      - name: Commit updated counts
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update add-on installation counts"
          git push
