---
name: Somfy dev addon tests

# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - "SomfyProtect2MQTT-dev/**"
      - ".github/workflows/somfy-dev-tests.yaml"
  pull_request:
    paths:
      - "SomfyProtect2MQTT-dev/**"
      - ".github/workflows/somfy-dev-tests.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - name: Check shell scripts
        run: shellcheck SomfyProtect2MQTT-dev/rootfs/etc/s6-overlay/s6-rc.d/SomfyProtect2MQTT/{run,finish}
      - name: Build and check native backends
        run: docker build --platform linux/${{ matrix.arch }} -t somfy-addon-test SomfyProtect2MQTT-dev
      - name: Test addon startup
        run: >-
          docker run --rm --platform linux/${{ matrix.arch }}
          --entrypoint python3
          -v "$PWD/SomfyProtect2MQTT-dev:/addon:ro"
          somfy-addon-test -m unittest discover -s /addon/tests -v
